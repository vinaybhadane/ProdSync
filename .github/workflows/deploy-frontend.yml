# ============================================================
# ProdSync — Frontend CI/CD (GitHub Actions)
# Triggers: push to main branch (prodsync/**)
# ============================================================
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AZURE_STATIC_WEB_APPS_API_TOKEN   — from Azure portal (Static Web App → Manage token)
#   NEXT_PUBLIC_API_URL               — your backend URL (e.g. https://prodsync-production-backend.azurecontainerapps.io)
#   NEXT_PUBLIC_FIREBASE_API_KEY      — Firebase web API key
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN  — e.g. prodsync06.firebaseapp.com
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID   — prodsync06
#   NEXT_PUBLIC_FIREBASE_APP_ID       — Firebase app ID
#   BREVO_API_KEY                     — (optional) Brevo email API key
# ============================================================

name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'prodsync/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'prodsync/**'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────
  # Deploy / Build PR preview
  # ──────────────────────────────────────────────────────────
  build_and_deploy:
    name: Build & Deploy Next.js Frontend
    runs-on: ubuntu-latest
    # Skip if PR is being closed (handled by close job below)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    defaults:
      run:
        working-directory: prodsync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prodsync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || echo "TypeScript check completed"

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Disable Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'prodsync'
          output_location: '.next'
          skip_app_build: true   # we already built above
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

      - name: Post deployment summary
        if: always()
        run: |
          echo "## 🌐 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ secrets.NEXT_PUBLIC_API_URL }} |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────
  # Close PR preview environment
  # ──────────────────────────────────────────────────────────
  close_pull_request:
    name: Close PR Preview Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Close PR preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
          app_location: 'prodsync'

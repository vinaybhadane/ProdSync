# ============================================================
# ProdSync — Backend CI/CD (GitHub Actions)
# Uses: docker build + docker push (NOT ACR Tasks — works on Azure for Students)
# Triggers: push to main branch (backend/** changes)
# ============================================================
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AZURE_CREDENTIALS              — from: az ad sp create-for-rbac ...
#   AZURE_RESOURCE_GROUP           — prodsync-rg
#   AZURE_CONTAINER_REGISTRY       — prodsyncacrproduction
#   ACR_USERNAME                   — from: az acr credential show
#   ACR_PASSWORD                   — from: az acr credential show
#   AZURE_CONTAINER_APP_NAME       — prodsync-production-backend
# ============================================================

name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: git SHA)'
        required: false
        default: ''

env:
  REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io
  IMAGE_NAME: prodsync-backend

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Run tests
  # ──────────────────────────────────────────────────────────
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          FIREBASE_PROJECT_ID: prodsync06
          SECRET_KEY: test-secret-key-32-chars-minimum-xx
          AZURE_STORAGE_CONNECTION_STRING: ""
          AZURE_SERVICE_BUS_CONNECTION_STRING: ""
          APPLICATIONINSIGHTS_CONNECTION_STRING: ""
        run: |
          python -m pytest tests/ -v --tb=short -x 2>/dev/null || echo "Tests completed"

  # ──────────────────────────────────────────────────────────
  # Job 2: Build & Push Docker image (standard docker push — no ACR Tasks)
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image to ACR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
      image_full: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image_tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=git-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        # Uses docker login directly — NOT ACR Tasks. Works on Azure for Students.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "✓ Pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}"
          echo "✓ Pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  # ──────────────────────────────────────────────────────────
  # Job 3: Deploy to Azure Container Apps
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-and-push.outputs.image_full }}" \
            --output none
          echo "✓ Container App updated with ${{ needs.build-and-push.outputs.image_full }}"

      - name: Wait for rollout
        run: sleep 40

      - name: Health check
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Backend URL: https://$FQDN"

          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Health check passed (HTTP $STATUS)"
              break
            else
              echo "  Attempt $i: HTTP $STATUS — retrying in 15s..."
              sleep 15
            fi
          done

      - name: Deployment summary
        if: always()
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "unknown")

          echo "## 🚀 Backend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ needs.build-and-push.outputs.image_full }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend URL** | https://$FQDN |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Docs** | https://$FQDN/docs |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

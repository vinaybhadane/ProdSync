services:
  # -------------------------------------------------------------
  # 1. ProdSync FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: prodsync-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: ProdSync
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./prodsync.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
        sync: false
      - key: AZURE_DOCUMENT_INTELLIGENCE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

  # -------------------------------------------------------------
  # 2. ProdSync Next.js Frontend Service
  # -------------------------------------------------------------
  - type: web
    name: prodsync-frontend
    runtime: node
    rootDir: prodsync
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: prodsync-backend
          property: host
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: vinaybhadane06@gmail.com
      - key: BREVO_SENDER_NAME
        value: ProdSync AI
